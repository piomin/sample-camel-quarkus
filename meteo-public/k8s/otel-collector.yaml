apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: cluster-collector
  namespace: otel
spec:
  config:
    exporters:
      debug: {}
      otlp_grpc/traces:
        auth:
          authenticator: bearertokenauth
        endpoint: 'tempo-basic-gateway.tempo.svc.cluster.local:8090'
        headers:
          X-Scope-OrgID: dev
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          insecure: false
      otlp_http/traces:
        auth:
          authenticator: bearertokenauth
        endpoint: 'https://tempo-basic-gateway.tempo.svc.cluster.local:8080/api/traces/v1/dev'
        headers:
          X-Scope-OrgID: dev
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          insecure: false
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    processors:
      batch:
        send_batch_max_size: 10000
        timeout: 5s
      tail_sampling:
        policies:
          - name: errors
            status_code:
              status_codes:
                - ERROR
            type: status_code
          - latency:
              threshold_ms: 2500
            name: slow
            type: latency
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: '0.0.0.0:4317'
          http:
            endpoint: '0.0.0.0:4318'
    service:
      extensions:
        - bearertokenauth
      pipelines:
        traces:
          exporters:
            - debug
            - otlp_grpc/traces
            - otlp_http/traces
          processors:
            - tail_sampling
          receivers:
            - otlp
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8889
  mode: deployment
  serviceAccount: otel-collector