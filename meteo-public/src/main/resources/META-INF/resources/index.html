<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Hat Run Check</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='42' rx='28' ry='8' fill='%23ee0000'/%3E%3Cpath d='M14 42 Q14 14 32 14 Q50 14 50 42Z' fill='%23ee0000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <svg class="hat" viewBox="0 0 120 80" aria-hidden="true">
        <ellipse cx="60" cy="56" rx="56" ry="14" fill="#ee0000"/>
        <path d="M24 54 Q22 8 60 8 Q98 8 96 54 Z" fill="#ee0000"/>
        <path d="M25 46 Q60 56 95 46 L96 54 Q60 64 24 54 Z" fill="#111"/>
        <ellipse cx="60" cy="56" rx="56" ry="14" fill="none" stroke="#a30000" stroke-width="2"/>
      </svg>
      <h1>Red Hat <span>Run Check</span></h1>
      <p class="tagline">Is it a good day for a run? Enter a city and find out.</p>
    </header>

    <form id="rating-form" class="search glass" autocomplete="off">
      <label class="field">
        <span>City</span>
        <input id="city" name="city" type="text" placeholder="e.g. Warsaw" required>
      </label>
      <label class="field field-country">
        <span>Country code</span>
        <input id="country" name="country" type="text" placeholder="e.g. PL" list="countries"
               maxlength="2" pattern="[A-Za-z]{2}" title="Two-letter ISO country code" required>
        <datalist id="countries">
          <option value="PL">Poland</option><option value="DE">Germany</option>
          <option value="GB">United Kingdom</option><option value="US">United States</option>
          <option value="FR">France</option><option value="ES">Spain</option>
          <option value="IT">Italy</option><option value="NL">Netherlands</option>
          <option value="CZ">Czechia</option><option value="CA">Canada</option>
          <option value="AU">Australia</option><option value="JP">Japan</option>
        </datalist>
      </label>
      <button id="submit" type="submit">
        <span class="btn-label">Check running conditions</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="error" class="error glass" role="alert" hidden></div>

    <section id="result" class="result" hidden aria-live="polite">
      <div class="summary glass">
        <div id="grade" class="grade" aria-label="Overall rating"></div>
        <div class="summary-text">
          <h2 id="place"></h2>
          <p id="verdict"></p>
          <p id="coords" class="muted"></p>
        </div>
      </div>
      <div id="cards" class="cards"></div>
    </section>

    <footer>Data from Open-Meteo &middot; Powered by Apache Camel on Quarkus</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
